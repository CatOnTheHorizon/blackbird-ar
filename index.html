<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>黑鸟面包巴士 · 月历彩蛋</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0e0e1a; overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; touch-action:none; }
  #container { position:fixed; inset:0; }
  video, canvas { position:absolute; top:0; left:0; }

  #splash { position:fixed; inset:0; z-index:30; background:#0e0e1a; color:#f5f0e6;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; }
  #splash h1 { font-size:22px; letter-spacing:2px; margin:0; color:#ffd34d; }
  #splash p { font-size:14px; line-height:1.8; margin:0; opacity:.85; text-align:center; }
  #splash button { width:min(72vw, 300px); }
  #arBtn { margin-top:10px; padding:14px 20px; font-size:16px; letter-spacing:4px;
    border:none; border-radius:999px; background:#ffd34d; color:#222; font-weight:600; }
  #vrBtn { margin-top:4px; padding:11px 20px; font-size:13px; letter-spacing:2px;
    border:1px solid #555; border-radius:999px; background:transparent; color:#bbb; }
  .bird { font-size:44px; animation: flap 1.6s ease-in-out infinite; }
  @keyframes flap { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-10px) rotate(6deg)} }

  #status { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:40;
    max-width:86vw; text-align:center;
    background:rgba(14,14,26,.78); color:#f5f0e6; font-size:13px; letter-spacing:1px;
    padding:8px 18px; border-radius:999px; pointer-events:none; transition:opacity .4s; }
  #scanHint { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:40;
    color:#ffd34d; font-size:15px; letter-spacing:2px; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.8);
    transition:opacity .4s; white-space:nowrap; }
  .hidden { opacity:0 !important; }

  #vrRoot { position:fixed; inset:0; z-index:20; display:none; background:#0e0e1a; }
  #vrHint { position:fixed; bottom:30px; left:50%; transform:translateX(-50%); z-index:41;
    color:#f5f0e6; font-size:13px; letter-spacing:2px; opacity:.75; pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,.8); white-space:nowrap; }
  #vrExit { position:fixed; top:14px; right:14px; z-index:41; padding:8px 16px; font-size:13px;
    border-radius:999px; border:1px solid #666; background:rgba(14,14,26,.6); color:#ddd; }
</style>
</head>
<body>

<div id="splash">
  <div class="bird">🐦‍⬛</div>
  <h1>黑鸟面包巴士</h1>
  <p>2026 伊坂幸太郎月历 · 隐藏彩蛋</p>
  <button id="arBtn">开始 AR · 对准月历插画</button>
  <button id="vrBtn">进入 VR · 插画动起来</button>
  <p style="font-size:11px;opacity:.4;margin-top:10px">v22</p>
</div>

<div id="container"></div>
<div id="status" class="hidden">加载中…</div>
<div id="scanHint" class="hidden">对准月历上的「BYE BYE BLACKBIRD」插画 ✦</div>

<div id="vrRoot">
  <button id="vrExit">返回</button>
  <div id="vrHint">拖动画面环视 · 手机上可移动观看</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/",
    "mindar-image-three": "./lib/mindar-image-three.prod.js"
  }
}
</script>

<script type="module">
/* 重依赖懒加载：页面秒开、按钮秒响应 */
let THREE = null;
let MindARThree = null;
async function ensureThree() {
  if (!THREE) {
    THREE = await import('three');
    THREE.ColorManagement.legacyMode = false;
  }
  return THREE;
}
async function ensureMindAR() {
  await ensureThree();
  if (!MindARThree) MindARThree = (await import('mindar-image-three')).MindARThree;
}

const statusEl = document.getElementById('status');
const hintEl   = document.getElementById('scanHint');
const splash   = document.getElementById('splash');
const vrRoot   = document.getElementById('vrRoot');
const vrHint   = document.getElementById('vrHint');

const showErr = (msg) => {
  statusEl.classList.remove('hidden');
  statusEl.textContent = '⚠ ' + String(msg).slice(0, 120);
};
window.addEventListener('error', (e) => showErr(e.message || '脚本错误'));
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  showErr((r && (r.message || r)) || '未处理的异常');
});
const backToSplash = () => { splash.style.display = 'flex'; };

/* ── 音效（Web Audio 合成，无需外部文件） ── */
let actx = null;
function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!actx) actx = new Ctx();
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function playHorn() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime;
  const master = ctx.createGain(); master.gain.value = 0.14;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
  master.connect(lp).connect(ctx.destination);
  const beep = (start, dur) => {
    [392, 494].forEach(f => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0 + start);
      g.gain.linearRampToValueAtTime(1, t0 + start + 0.03);
      g.gain.setValueAtTime(1, t0 + start + dur - 0.05);
      g.gain.linearRampToValueAtTime(0, t0 + start + dur);
      o.connect(g).connect(master);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
    });
  };
  beep(0, 0.26);
  beep(0.36, 0.5);
}
function playCheer() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime;
  for (let i = 0; i < 16; i++) {
    const st = Math.random() * 1.2;
    const f0 = 1900 + Math.random() * 1400;
    const dur = 0.05 + Math.random() * 0.07;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0 + st);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.45, t0 + st + dur * 0.55);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.95, t0 + st + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0 + st);
    g.gain.linearRampToValueAtTime(0.05, t0 + st + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + st + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t0 + st); o.stop(t0 + st + dur + 0.02);
  }
}

/* ══════════ 原画贴片场景（AR / VR 共用） ══════════ */
const UNIT = 1 / 1745;                    // 目标图宽归一化为 1
const pxX = (px) => (px / 1745 - 0.5);
const pxY = (py) => (0.5 - py / 1280) * (1280 / 1745);
let ART_META = null;
let ART_TEX = null;

let ART_LOADING = null;
async function loadArtAssets(onProgress) {
  if (ART_META) return;
  if (!ART_LOADING) {
    ART_LOADING = (async () => {
      await ensureThree();
      const meta = await (await fetch('./assets/sprites/meta.json')).json();
      const loader = new THREE.TextureLoader();
      const names = ['bus', 'bird1', 'bird2', 'bird3', 'bird4', 'bird6', 'sign', 'bench', 'wheel0', 'wheel1'];
      const tex = {};
      let done = 0;
      const cb = onProgress || (() => {});
      await Promise.all(names.map(async (n) => {
        const t = await loader.loadAsync('./assets/sprites/' + n + '.webp');
        t.encoding = THREE.sRGBEncoding;
        t.minFilter = THREE.LinearFilter;
        t.generateMipmaps = false;
        tex[n] = t;
        done += 1;
        cb(done, names.length);
      }));
      ART_META = meta;
      ART_TEX = tex;
    })();
  }
  return ART_LOADING;
}

function spriteMesh(name, meta, tex, z = 0) {
  const [x0, y0, x1, y1] = meta.rects[name];
  const w = (x1 - x0) * UNIT, h = (y1 - y0) * UNIT;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex[name], transparent: true, depthWrite: false })
  );
  m.position.set(pxX((x0 + x1) / 2), pxY((y0 + y1) / 2), z);
  return m;
}

/* 四角星闪光贴图（原画风格的星点） */
function sparkleTexture(color = '#fff6d8') {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 26);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(255,246,216,0)');
  ctx.fillStyle = g;
  /* 四角星形 */
  ctx.beginPath();
  ctx.moveTo(64, 6);
  ctx.quadraticCurveTo(70, 56, 122, 64);
  ctx.quadraticCurveTo(70, 72, 64, 122);
  ctx.quadraticCurveTo(58, 72, 6, 64);
  ctx.quadraticCurveTo(58, 56, 64, 6);
  ctx.fill();
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  return t;
}

/* 天空渐变平面（取自原画采样色） */
function skyPlane(stops) {
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 512;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 512);
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(8.0, 6.5),
    new THREE.MeshBasicMaterial({ map: tex })
  );
  m.position.set(0, 0.3, -3.6);
  return m;
}

function createArtScene(meta, tex, opts = {}) {
  const { withSky = false, driveFromX = 1.35, driveDur = 4.2 } = opts;
  const group = new THREE.Group();
  const animatables = [];

  if (withSky) group.add(skyPlane(meta.skyStops));

  /* —— 星星（闪烁） —— */
  const sparkTex = sparkleTexture();
  const stars = [];
  for (let i = 0; i < 24; i++) {
    const s = new THREE.Mesh(
      new THREE.PlaneGeometry(0.055, 0.055),
      new THREE.MeshBasicMaterial({ map: sparkTex, transparent: true, depthWrite: false, opacity: 0.9 })
    );
    s.position.set((Math.random() - 0.5) * 1.1,
                   -0.02 + Math.random() * 0.45,
                   -1.0 + Math.random() * 0.45);
    s.userData = { ph: Math.random() * Math.PI * 2, base: 0.5 + Math.random() * 0.8 };
    stars.push(s);
    group.add(s);
  }

  /* —— 站牌（绕底部支点轻摆） —— */
  const signZ = 0.012;
  const signGroup = new THREE.Group();
  {
    const [x0, y0, x1, y1] = meta.rects.sign;
    const sign = spriteMesh('sign', meta, tex, 0);
    sign.material.side = THREE.DoubleSide;      // 翻转时背面可见
    const pivotX = pxX(1554);                   // 杆轴
    const pyBottom = pxY(y1);
    signGroup.position.set(pivotX, pyBottom, signZ);
    sign.position.set(pxX((x0 + x1) / 2) - pivotX, pxY((y0 + y1) / 2) - pyBottom, 0);
    signGroup.add(sign);
    group.add(signGroup);
  }

  /* —— 长椅 —— */
  const bench = spriteMesh('bench', meta, tex, 0.02);
  group.add(bench);

  /* —— 面包巴士（整体悬浮/驶入），车轮独立旋转 —— */
  const busGroup = new THREE.Group();
  const bus = spriteMesh('bus', meta, tex, 0);
  busGroup.add(bus);
  const wheels = [];
  meta.wheels.forEach(([wx, wy, wr], i) => {
    const wm = new THREE.Mesh(
      new THREE.PlaneGeometry(2 * wr * UNIT, 2 * wr * UNIT),
      new THREE.MeshBasicMaterial({ map: tex['wheel' + i], transparent: true, depthWrite: false })
    );
    /* 车轮位置 = 巴士贴片的局部坐标 + 车轮相对巴士中心的偏移 */
    const [bx0, by0, bx1, by1] = meta.rects.bus;
    wm.position.set(bus.position.x + (wx - (bx0 + bx1) / 2) * UNIT,
                    bus.position.y + ((by0 + by1) / 2 - wy) * UNIT,
                    0.004);
    busGroup.add(wm);
    wheels.push(wm);
  });
  busGroup.position.z = -0.04;
  group.add(busGroup);

  /* —— 鸟群 —— */
  const birds = [];
  const birdDefs = [
    { name: 'bird1', z: 0.045, phase: 0.0 },
    { name: 'bird2', z: 0.046, phase: 1.3 },
    { name: 'bird3', z: 0.047, phase: 2.4 },
    { name: 'bird4', z: 0.048, phase: 3.1 },
    { name: 'bird6', z: 0.049, phase: 4.2 },
  ];
  birdDefs.forEach((d) => {
    const m = spriteMesh(d.name, meta, tex, d.z);
    const base = m.position.clone();
    m.userData = { baseY: base.y, phase: d.phase, baseRot: 0 };
    birds.push(m);
    group.add(m);
  });

  /* —— 驶入状态 —— */
  const busRest = new THREE.Vector3(0, 0, -0.04);
  const busStart = new THREE.Vector3(driveFromX, 0, -0.04);
  let drive = null, wheelAngle = 0, lastT = 0;
  let hornFired = false, cheerFired = false, wasDriving = false;

  const animate = (t) => {
    const dt = Math.min(0.05, Math.max(0, t - lastT));
    lastT = t;

    /* 巴士 */
    let driving = false, driveK = 1;
    if (drive) {
      const p = Math.min(1, Math.max(0, (t - drive.t0) / driveDur));
      driveK = p;
      if (p < 1) {
        driving = true;
        const e = p * p * (3 - 2 * p);                       // 平滑起步、缓缓停下
        busGroup.position.x = busStart.x * (1 - e);
        busGroup.position.y = busRest.y
          + Math.sin(p * Math.PI) * 0.010                    // 车身起伏
          + Math.sin(t * 8) * 0.004 * (1 - e);               // 行驶轻微震动
        busGroup.rotation.z = (1 - e) * -0.05 + Math.sin(t * 9) * 0.005 * (1 - e);
        busGroup.rotation.x = 0;
      } else {
        drive = null;
        busGroup.position.copy(busRest);
        busGroup.rotation.set(0, 0, 0);
      }
    }
    if (!driving) {
      busGroup.position.y = busRest.y + Math.sin(t * 1.1) * 0.008;
      busGroup.rotation.z = Math.sin(t * 0.8) * 0.006;
    }
    const wheelSpeed = driving ? (2 + (1 - driveK) * 10) : 1.2;
    wheelAngle -= wheelSpeed * dt;
    wheels.forEach(w => { w.rotation.z = wheelAngle; });

    /* 鸟群：每只独立地上下跳跃 */
    const excite = 1 + (1 - driveK) * 1.1;
    birds.forEach((b, i) => {
      const ph = b.userData.phase;
      const period = (2.4 + (i * 0.53) % 1.6) / excite;   // 各自周期不同
      const cyc = ((t / period) + ph) % 1;
      let hop = 0;
      if (cyc < 0.55) {
        const q = cyc / 0.55;                              // 抛物线式腾空
        hop = 4 * q * (1 - q);
      }
      const h = 0.020 + (i % 3) * 0.006;                   // 跳起高度不同
      b.position.y = b.userData.baseY + hop * h + Math.sin(t * 1.3 + ph) * 0.002;
      b.rotation.z = Math.sin(t * 2 + ph) * 0.02 + hop * 0.04;
    });

    /* 站牌：轻摆 + 周期性整体翻转 */
    const flipCycle = 5.0;
    const fu = (t % flipCycle) / flipCycle;
    let signRotY = Math.sin(t * 0.6) * 0.08;
    if (fu < 0.22) {
      const q = fu / 0.22;
      const fe = q * q * (3 - 2 * q);
      signRotY += Math.PI * 2 * fe;
    }
    signGroup.rotation.y = signRotY;
    signGroup.rotation.z = Math.sin(t * 0.7) * 0.008;

    /* 星星闪烁 */
    stars.forEach(s => {
      const k = 0.5 + 0.5 * Math.sin(t * 2.2 + s.userData.ph);
      s.scale.setScalar(0.5 + k * s.userData.base);
      s.material.opacity = 0.35 + k * 0.6;
    });
  };

  const startDriveIn = (t0) => { drive = { t0: t0 == null ? 0 : t0 }; };

  return { group, animate, startDriveIn };
}

/* ══════════ AR 模式 ══════════ */
document.getElementById('arBtn').addEventListener('click', () => { ensureAudio(); startAR(); });

let arBusy = false;
async function startAR() {
  if (arBusy) return;
  arBusy = true;
  splash.style.display = 'none';
  statusEl.classList.remove('hidden');
  statusEl.textContent = '正在加载识别引擎…（首次较慢，请稍候）';
  try {
    await ensureMindAR();
  } catch (e) {
    arBusy = false;
    statusEl.textContent = '识别引擎加载失败：' + (e && e.message || e) + '，请检查网络后重试';
    setTimeout(backToSplash, 3500);
    return;
  }

  statusEl.textContent = '请求摄像头权限…（请在弹窗中允许）';
  const permHint = setTimeout(() => {
    statusEl.textContent = '还在等待授权…请检查浏览器是否弹出了摄像头权限窗口，或刷新页面重试';
  }, 25000);
  let camStream = null;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    clearTimeout(permHint);
    /* 不关流：这路流会直接交给 MindAR 复用，避免 iOS 二次请求摄像头的竞态 */
  } catch (e) {
    clearTimeout(permHint);
    statusEl.textContent = e && e.name === 'NotAllowedError'
      ? '摄像头权限被拒绝：请刷新页面并在弹窗中点「允许」'
      : '无法访问摄像头：' + (e && e.message || e.name || '未知错误');
    setTimeout(backToSplash, 3000);
    arBusy = false;
    return;
  }

  statusEl.textContent = '加载插画素材…';
  try {
    await loadArtAssets((d, n) => { statusEl.textContent = '加载插画素材… ' + d + '/' + n; });
  } catch (e) {
    statusEl.textContent = '插画素材加载失败：' + (e && e.message || e);
    setTimeout(backToSplash, 3500);
    arBusy = false;
    return;
  }

  statusEl.textContent = '加载识别数据… 0%';
  let mindUrl;
  try {
    const resp = await fetch('./assets/target.mind');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const total = +resp.headers.get('content-length') || 833135;
    const reader = resp.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      statusEl.textContent = '加载识别数据… ' + Math.min(99, Math.round(got / total * 100)) + '%';
    }
    mindUrl = URL.createObjectURL(new Blob(chunks, { type: 'application/octet-stream' }));
  } catch (e) {
    statusEl.textContent = '识别数据下载失败（' + (e && e.message || '网络错误') + '），请检查网络后重试';
    setTimeout(backToSplash, 3500);
    arBusy = false;
    return;
  }

  const mindarThree = new MindARThree({
    container: document.getElementById('container'),
    imageTargetSrc: mindUrl,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    maxTrack: 1,
  });
  const { renderer, scene, camera } = mindarThree;
  const anchor = mindarThree.addAnchor(0);
  const anchorRoot = anchor.group || anchor;

  const art = createArtScene(ART_META, ART_TEX, { withSky: false, driveFromX: -1.15, driveDur: 5.2 });
  art.group.position.z = 0.01;
  anchorRoot.add(art.group);

  /* 用预检拿到的流启动视频，绕开 MindAR 内部的二次 getUserMedia */
  mindarThree._startVideo = () => new Promise((resolve, reject) => {
    statusEl.textContent = '启动摄像头…';
    const video = document.createElement('video');
    video.setAttribute('autoplay', '');
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.style.cssText = 'position:absolute;top:0;left:0;z-index:-2;';
    mindarThree.video = video;
    mindarThree.container.appendChild(video);
    if (!camStream) { reject(new Error('摄像头流不可用')); return; }
    video.srcObject = camStream;
    const ok = () => resolve();
    video.addEventListener('loadedmetadata', ok, { once: true });
    setTimeout(() => reject(new Error('摄像头视频流启动超时')), 20000);
    if (video.play) video.play().catch(() => {});
  });
  const origAR = mindarThree._startAR.bind(mindarThree);
  mindarThree._startAR = async () => { statusEl.textContent = '初始化识别引擎…（首次最长约 1 分钟）'; return origAR(); };

  anchor.onTargetFound = () => {
    statusEl.textContent = '✦ 彩蛋解锁 ✦';
    hintEl.classList.add('hidden');
    setTimeout(() => statusEl.classList.add('hidden'), 2500);
  };
  anchor.onTargetLost = () => {
    statusEl.classList.add('hidden');
    hintEl.classList.remove('hidden');
  };

  const t0Init = Date.now();
  const tickInit = setInterval(() => {
    const sec = Math.round((Date.now() - t0Init) / 1000);
    statusEl.textContent = '初始化识别引擎…已等待 ' + sec + ' 秒（首次较慢属正常）';
  }, 5000);
  const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('初始化超时（150秒）')), 150000));
  try {
    await Promise.race([mindarThree.start(), timeout]);
  } catch (e) {
    clearInterval(tickInit);
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    statusEl.textContent = '启动失败：' + (e && e.message || '未知错误') + '，请刷新重试';
    setTimeout(backToSplash, 4000);
    arBusy = false;
    return;
  }
  clearInterval(tickInit);
  statusEl.classList.add('hidden');
  hintEl.classList.remove('hidden');

  const clock = new THREE.Clock();
  let driveStarted = false;
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    if (!driveStarted && anchor.visible) {
      art.startDriveIn(t + 0.1);
      driveStarted = true;
    }
    art.animate(t);
    renderer.render(scene, camera);
  });
}

/* ══════════ VR 模式 ══════════ */
let vrActive = false;
let vrState = null;
let yawT = 0, pitchT = 0, lastInteract = 0, gyroBase = null, gyroOff = 0;

document.getElementById('vrBtn').addEventListener('click', () => { ensureAudio(); enterVR(false); });
document.getElementById('vrExit').addEventListener('click', () => {
  vrActive = false;
  vrRoot.style.display = 'none';
  if (vrState && vrState.renderer.domElement.parentNode) {
    vrState.renderer.domElement.parentNode.removeChild(vrState.renderer.domElement);
  }
  vrState = null;
  vrBusy = false;
  backToSplash();
});

/* 拖动 / 陀螺仪（全局监听一次） */
{
  let dragging = false, lastX = 0, lastY = 0;
  vrRoot.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
  vrRoot.addEventListener('pointermove', (e) => {
    if (!dragging || !vrActive) return;
    yawT   = Math.max(-0.5, Math.min(0.5, yawT + (e.clientX - lastX) * 0.004));
    pitchT = Math.max(-0.18, Math.min(0.22, pitchT - (e.clientY - lastY) * 0.003));
    lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('deviceorientation', (e) => {
    if (!vrActive || e.alpha == null) return;
    if (gyroBase == null) gyroBase = e.alpha;
    let d = e.alpha - gyroBase;
    d = ((d + 540) % 360) - 180;
    gyroOff = -d * Math.PI / 180 * 0.8;
  });
}

let vrBusy = false;
async function enterVR(auto = false) {
  if (vrBusy) return;
  vrBusy = true;
  splash.style.display = 'none';
  vrRoot.style.display = 'block';
  statusEl.classList.remove('hidden');
  statusEl.textContent = '正在准备场景…';
  try {
    await ensureThree();
  } catch (e) {
    vrBusy = false;
    showErr('加载失败：' + (e && e.message || e));
    return;
  }
  vrActive = true;
  yawT = 0; pitchT = 0; gyroBase = null; gyroOff = 0;
  lastInteract = performance.now();
  vrHint.textContent = '拖动画面环视 · 手机上可移动观看';

  if (!auto && typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
    try {
      const p = await DeviceOrientationEvent.requestPermission();
      if (p === 'granted') vrHint.textContent = '转动手机环视 · 也可拖动';
    } catch {}
  }

  try {
    await loadArtAssets();
  } catch (e) {
    vrBusy = false;
    showErr('插画素材加载失败：' + (e && e.message || e));
    return;
  }

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  vrRoot.insertBefore(renderer.domElement, vrRoot.firstChild);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x201b33);
  const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
  let camDist = 2.4;

  const fitCamera = () => {
    const tanV = Math.tan((camera.fov * Math.PI / 180) / 2);
    const aspect = innerWidth / innerHeight;
    const halfW = 0.56, halfH = 0.40;
    camDist = Math.max(halfW / (tanV * aspect), halfH / tanV) * 1.06;
  };
  fitCamera();
  window.addEventListener('resize', () => {
    if (!vrActive) return;
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
    fitCamera();
  });

  const art = createArtScene(ART_META, ART_TEX, { withSky: true, driveFromX: -1.35, driveDur: 6.5 });
  scene.add(art.group);
  art.startDriveIn(0.9);

  vrState = { renderer, scene, camera };
  statusEl.classList.add('hidden');

  const clock = new THREE.Clock();
  let yaw = 0, pitch = 0;
  (function tick() {
    if (!vrActive) { renderer.dispose(); return; }
    const t = clock.getElapsedTime();
    art.animate(t);

    /* 相机：小角度环绕（纸偶剧场的视差）+ 缓慢呼吸漂移 */
    const idle = performance.now() - lastInteract > 3000;
    const breatheY = idle ? Math.sin(t * 0.22) * 0.035 : 0;
    const breatheX = idle ? Math.sin(t * 0.17) * 0.012 : 0;
    const ty = yawT + gyroOff * 0.5 + breatheY;
    const tp = pitchT + breatheX;
    yaw += (ty - yaw) * 0.08;
    pitch += (tp - pitch) * 0.08;

    const cy0 = -0.05;   // 内容垂直中心
    camera.position.set(
      Math.sin(yaw) * Math.cos(pitch) * camDist,
      Math.sin(pitch) * camDist + cy0,
      Math.cos(yaw) * Math.cos(pitch) * camDist
    );
    camera.lookAt(0, cy0, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  })();
}

/* 空闲时预加载（不阻塞按钮响应） */
setTimeout(() => { ensureThree().then(() => loadArtAssets()).catch(() => {}); }, 500);

if (new URLSearchParams(location.search).get('mode') === 'vr') {
  enterVR(true);
}
