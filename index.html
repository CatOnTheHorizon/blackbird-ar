<script type="module">
/* 重依赖懒加载：页面秒开、按钮秒响应 */
let THREE = null;
let MindARThree = null;
async function ensureThree() {
  if (!THREE) {
    THREE = await import('three');
    THREE.ColorManagement.legacyMode = false;
  }
  return THREE;
}
async function ensureMindAR() {
  await ensureThree();
  if (!MindARThree) MindARThree = (await import('mindar-image-three')).MindARThree;
}

const statusEl = document.getElementById('status');
const hintEl   = document.getElementById('scanHint');
const splash   = document.getElementById('splash');
const vrRoot   = document.getElementById('vrRoot');
const vrHint   = document.getElementById('vrHint');
let entryMode = null;
const music = createBackgroundMusic(document.getElementById('backgroundMusic'),
  document.getElementById('musicToggle'), document.getElementById('musicNote'));

const showErr = (msg) => {
  statusEl.classList.remove('hidden');
  statusEl.textContent = '⚠ ' + String(msg).slice(0, 120);
};
window.addEventListener('error', (e) => showErr(e.message || '脚本错误'));
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  showErr((r && (r.message || r)) || '未处理的异常');
});
const backToSplash = () => {
  entryMode = null;
  music.stop();
  splash.style.display = 'flex';
  const b = document.getElementById('arBtn');
  b.disabled = false;
  b.textContent = '开始 AR · 对准月历插画';
};

/* ── 手机画质与本机诊断（?debug=1，不上传数据） ── */
const MOBILE_VIEW = matchMedia('(pointer: coarse)').matches
  || /Android|iPhone|iPad|iPod/.test(navigator.userAgent);
const PERF_DEBUG = new URLSearchParams(location.search).get('debug') === '1';

function getRenderPixelRatio(dpr, mobile) {
  const ratio = Number.isFinite(dpr) && dpr > 0 ? dpr : 1;
  return Math.min(ratio, mobile ? 1.5 : 2);
}

function dampingFactor(dt) {
  return 1 - Math.exp(-5 * Math.max(0, Math.min(dt, 0.1)));
}

async function requestCameraStream() {
  try {
    return await navigator.mediaDevices.getUserMedia({ audio: false, video: {
      facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 },
      frameRate: { ideal: 30, max: 30 }
    } });
  } catch (error) {
    if (error.name !== 'OverconstrainedError' && error.name !== 'ConstraintNotSatisfiedError') throw error;
    return navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: 'environment' } });
  }
}

function createFrameMonitor(renderer, mode) {
  const size = new THREE.Vector2();
  const stats = { mode, fps: null, frameMs: null, trackingMs: null, tracking: false,
    pixelRatio: renderer.getPixelRatio(), drawCalls: 0, canvas: null, camera: null };
  let panel = null;
  if (PERF_DEBUG) {
    panel = document.createElement('output');
    panel.setAttribute('aria-label', '本机性能诊断');
    panel.style.cssText = 'position:fixed;left:10px;bottom:65px;z-index:45;padding:8px 10px;'
      + 'color:#fff;background:rgba(14,14,26,.78);font:11px/1.6 monospace;white-space:pre;pointer-events:none;';
    document.body.appendChild(panel);
    window.__blackbirdPerf = stats;
  }
  const publish = () => {
    if (!panel) return;
    const camera = stats.camera;
    panel.textContent = mode + ' · ' + (stats.fps == null ? '等待画面' : stats.fps + ' fps / ' + stats.frameMs + ' ms')
      + '\nDPR ' + stats.pixelRatio + ' · ' + stats.drawCalls + ' draws'
      + (stats.canvas ? ' · ' + stats.canvas.join('×') : '')
      + (mode === 'AR' ? '\n跟踪 ' + (stats.tracking ? (stats.trackingMs == null ? '采样中' : stats.trackingMs + ' ms/次') : '未识别') : '')
      + (camera ? '\n相机 ' + camera.width + '×' + camera.height + ' / ' + (camera.frameRate || '?') + ' fps' : '');
  };
  let previous = null, started = null, frames = 0, totalMs = 0, slow = 0, slowWindows = 0;
  let previousTrack = null, trackMs = 0, trackSamples = 0, warmup = true;
  const reset = () => {
    previous = started = previousTrack = null;
    frames = totalMs = slow = trackMs = trackSamples = slowWindows = 0;
    warmup = true;
  };
  publish();
  return {
    stats,
    reset,
    setCamera(settings) {
      stats.camera = { width: settings.width, height: settings.height, frameRate: settings.frameRate };
      publish();
    },
    setTracking(visible) {
      stats.tracking = visible;
      stats.trackingMs = null;
      previousTrack = null; trackMs = trackSamples = 0;
      publish();
    },
    track(now) {
      if (previousTrack != null && now > previousTrack) {
        trackMs += now - previousTrack; trackSamples += 1;
      }
      previousTrack = now;
    },
    frame(now, animationTime) {
      if (PERF_DEBUG) {
        stats.renderedFrames = (stats.renderedFrames || 0) + 1;
        stats.animationTime = Math.round(animationTime * 1000) / 1000;
        stats.lastFrameAt = now;
      }
      if (previous != null) {
        const dt = now - previous;
        totalMs += dt; frames += 1;
        if (dt > 25) slow += 1;
      }
      previous = now;
      if (started == null) started = now;
      if (now - started < 2000 || !frames) return;
      stats.frameMs = Math.round(totalMs / frames * 10) / 10;
      stats.fps = Math.round(frames * 1000 / totalMs);
      stats.trackingMs = trackSamples ? Math.round(trackMs / trackSamples * 10) / 10 : null;
      /* 跳过首次编译窗口；连续两个慢窗口才降低绘制像素，避免频繁跳档。 */
      slowWindows = !warmup && stats.frameMs > 24 && slow / frames > 0.25 ? slowWindows + 1 : 0;
      if (MOBILE_VIEW && slowWindows >= 2 && renderer.getPixelRatio() > 1) {
        renderer.setPixelRatio(Math.max(1, renderer.getPixelRatio() - 0.25));
        slowWindows = 0;
      }
      warmup = false;
      renderer.getDrawingBufferSize(size);
      stats.pixelRatio = renderer.getPixelRatio();
      stats.canvas = [size.x, size.y];
      stats.drawCalls = renderer.info.render.calls;
      publish();
      started = now; frames = totalMs = slow = trackMs = trackSamples = 0;
    },
    dispose() {
      if (panel) panel.remove();
      if (PERF_DEBUG && window.__blackbirdPerf === stats) delete window.__blackbirdPerf;
    }
  };
}

function disposeArtScene(group) {
  const geometries = new Set(), materials = new Set(), textures = new Set();
  group.traverse(object => {
    if (object.geometry) geometries.add(object.geometry);
    const list = Array.isArray(object.material) ? object.material : [object.material];
    list.forEach(material => {
      if (!material) return;
      materials.add(material);
      if (material.map && material.map.userData.artOwned) textures.add(material.map);
    });
    if (object.isInstancedMesh) object.dispose();
  });
  geometries.forEach(geometry => geometry.dispose());
  materials.forEach(material => material.dispose());
  textures.forEach(texture => texture.dispose());
}

/* ── 背景音乐：整页只用一份播放器，下载和播放都不阻塞场景。 ── */
function createBackgroundMusic(audio, button, note) {
  const title = 'Paul McCartney · Bye Bye Blackbird';
  let active = false, enabled = true, gesture = false, away = document.hidden;
  let request = 0, pending = false;
  audio.volume = 0.35;
  audio.loop = true;
  audio.preload = 'none';
  const wanted = () => active && enabled && !away && !document.hidden;
  const update = (state, message = title) => {
    button.dataset.state = state;
    button.setAttribute('aria-pressed', String(state === 'playing'));
    button.setAttribute('aria-label', state === 'playing' || state === 'loading' ? '暂停背景音乐' : '播放背景音乐');
    button.textContent = { playing: '♫ 音乐已开', loading: '♫ 音乐加载中…', off: '♫ 音乐已关',
      background: '♫ 后台已暂停', paused: '♫ 点击继续', blocked: '♫ 点击开启音乐',
      unavailable: '♫ 重试音乐', idle: '♫ 开启音乐' }[state];
    note.textContent = message;
  };
  const rest = () => update(!enabled ? 'off' : active && away ? 'background' : gesture && active ? 'paused' : 'idle');
  const pause = (reset = false) => {
    request += 1;
    pending = false;
    audio.pause();
    if (reset) { try { audio.currentTime = 0; } catch {} }
  };
  const play = () => {
    if (!wanted()) { rest(); return; }
    if (!audio.paused) { update('playing'); return; }
    if (pending) return;
    const current = ++request;
    pending = true;
    update('loading', '正在缓冲音乐…画面可继续使用');
    const failed = (error) => {
      if (current !== request) return;
      pending = false;
      if (!wanted()) { pause(); rest(); return; }
      pause();
      update(error && error.name === 'NotAllowedError' ? 'blocked' : 'unavailable',
        error && error.name === 'NotAllowedError' ? '浏览器需要点按一次才能播放音乐' : '音乐暂时不可用，点按可重试；画面不受影响');
    };
    try {
      Promise.resolve(audio.play()).then(() => {
        if (!wanted()) { pause(); rest(); return; }
        if (current !== request) return;
        pending = false;
        update(audio.paused ? 'paused' : 'playing');
      }, failed);
    } catch (error) { failed(error); }
  };
  const enter = (fromGesture = false) => {
    active = true;
    away = document.hidden;
    if (fromGesture) gesture = true;
    if (gesture && enabled) play();
    else rest();
  };
  const stop = () => {
    active = false; gesture = false;
    pause(true);
    rest();
  };
  button.addEventListener('click', () => {
    if (pending || !audio.paused) {
      enabled = false;
      pause(); rest();
    } else {
      enabled = true; active = true; gesture = true; away = document.hidden;
      if (audio.error) audio.load();
      play();
    }
  });
  audio.addEventListener('playing', () => {
    if (!wanted()) { pause(); rest(); return; }
    pending = false;
    update('playing');
  });
  audio.addEventListener('waiting', () => {
    if (wanted()) update('loading', '正在缓冲音乐…画面可继续使用');
  });
  audio.addEventListener('pause', () => { if (!pending) rest(); });
  audio.addEventListener('error', () => {
    const report = wanted();
    pause();
    if (report) update('unavailable', '音乐加载失败，点按可重试；画面不受影响');
    else rest();
  });
  const suspend = () => { away = true; pause(); rest(); };
  const resume = () => {
    away = document.hidden;
    if (wanted() && gesture) play();
    else rest();
  };
  document.addEventListener('visibilitychange', () => { if (document.hidden) suspend(); else resume(); });
  window.addEventListener('pagehide', suspend);
  window.addEventListener('pageshow', resume);
  rest();
  return { enter, stop };
}

/* ── 音效（Web Audio 合成，无需外部文件） ── */
let actx = null;
function ensureAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return null;
  if (!actx) actx = new Ctx();
  if (actx.state === 'suspended') actx.resume().catch(() => {});
  return actx;
}
function playHorn() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime;
  const master = ctx.createGain(); master.gain.value = 0.14;
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1500;
  master.connect(lp).connect(ctx.destination);
  const beep = (start, dur) => {
    [392, 494].forEach(f => {
      const o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t0 + start);
      g.gain.linearRampToValueAtTime(1, t0 + start + 0.03);
      g.gain.setValueAtTime(1, t0 + start + dur - 0.05);
      g.gain.linearRampToValueAtTime(0, t0 + start + dur);
      o.connect(g).connect(master);
      o.start(t0 + start); o.stop(t0 + start + dur + 0.02);
    });
  };
  beep(0, 0.26);
  beep(0.36, 0.5);
}
function playCheer() {
  const ctx = ensureAudio(); if (!ctx) return;
  const t0 = ctx.currentTime;
  for (let i = 0; i < 16; i++) {
    const st = Math.random() * 1.2;
    const f0 = 1900 + Math.random() * 1400;
    const dur = 0.05 + Math.random() * 0.07;
    const o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0 + st);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.45, t0 + st + dur * 0.55);
    o.frequency.exponentialRampToValueAtTime(f0 * 0.95, t0 + st + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t0 + st);
    g.gain.linearRampToValueAtTime(0.05, t0 + st + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0008, t0 + st + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t0 + st); o.stop(t0 + st + dur + 0.02);
  }
}

/* ══════════ 原画贴片场景（AR / VR 共用） ══════════ */
const UNIT = 1 / 1745;                    // 目标图宽归一化为 1
const pxX = (px) => (px / 1745 - 0.5);
const pxY = (py) => (0.5 - py / 1280) * (1280 / 1745);
let ART_META = null;
let ART_TEX = null;

const ART_VERSION = '30';
const artUrl = (name) => './assets/sprites/' + name + '?v=' + ART_VERSION;
let ART_LOADING = null;
async function loadArtAssets(onProgress) {
  if (ART_META) return;
  if (!ART_LOADING) {
    ART_LOADING = (async () => {
      await ensureThree();
      const response = await fetch(artUrl('meta.json'));
      if (!response.ok) throw new Error('贴片配置 HTTP ' + response.status);
      const meta = await response.json();
      if (String(meta.version) !== ART_VERSION) throw new Error('贴片版本不一致，请刷新页面');
      const loader = new THREE.TextureLoader();
      const names = ['bus', 'bird1', 'bird2', 'bird3', 'bird4', 'bird6', 'sign', 'bench', 'wheel0', 'wheel1'];
      const tex = {};
      let done = 0;
      const cb = onProgress || (() => {});
      await Promise.all(names.map(async (n) => {
        const t = await loader.loadAsync(artUrl(n + '.webp'));
        t.encoding = THREE.sRGBEncoding;
        t.minFilter = THREE.LinearFilter;
        t.generateMipmaps = false;
        tex[n] = t;
        done += 1;
        cb(done, names.length);
      }));
      ART_META = meta;
      ART_TEX = tex;
    })().catch((error) => { ART_LOADING = null; throw error; });
  }
  return ART_LOADING;
}

function spriteMesh(name, meta, tex, z = 0) {
  const [x0, y0, x1, y1] = meta.rects[name];
  const w = (x1 - x0) * UNIT, h = (y1 - y0) * UNIT;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex[name], transparent: true, depthWrite: false })
  );
  m.position.set(pxX((x0 + x1) / 2), pxY((y0 + y1) / 2), z);
  m.renderOrder = meta.renderOrder[name] || 0;
  return m;
}

/* 四角星闪光贴图（原画风格的星点） */
function sparkleTexture(color = '#fff6d8') {
  const cv = document.createElement('canvas');
  cv.width = cv.height = 128;
  const ctx = cv.getContext('2d');
  const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 26);
  g.addColorStop(0, color);
  g.addColorStop(1, 'rgba(255,246,216,0)');
  ctx.fillStyle = g;
  /* 四角星形 */
  ctx.beginPath();
  ctx.moveTo(64, 6);
  ctx.quadraticCurveTo(70, 56, 122, 64);
  ctx.quadraticCurveTo(70, 72, 64, 122);
  ctx.quadraticCurveTo(58, 72, 6, 64);
  ctx.quadraticCurveTo(58, 56, 64, 6);
  ctx.fill();
  const t = new THREE.CanvasTexture(cv);
  t.encoding = THREE.sRGBEncoding;
  t.userData.artOwned = true;
  return t;
}

/* 天空渐变：VR 是远景；AR 是与识别图同尺寸的干净底板。 */
function skyPlane(stops, targetSize = null) {
  const cv = document.createElement('canvas');
  cv.width = 8; cv.height = 512;
  const ctx = cv.getContext('2d');
  const g = ctx.createLinearGradient(0, 0, 0, 512);
  stops.forEach((c, i) => g.addColorStop(i / (stops.length - 1), c));
  ctx.fillStyle = g; ctx.fillRect(0, 0, 8, 512);
  const tex = new THREE.CanvasTexture(cv);
  tex.encoding = THREE.sRGBEncoding;
  tex.userData.artOwned = true;
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(targetSize ? 1 : 8.0, targetSize ? targetSize[1] / targetSize[0] : 6.5),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false, depthTest: false })
  );
  m.name = targetSize ? 'ar-backdrop' : 'vr-sky';
  /* AR 场景整体 z=0.01，底板抵消它，准确落回纸面而不是挡住整屏相机。 */
  m.position.set(0, targetSize ? 0 : 0.3, targetSize ? -0.01 : -3.6);
  m.renderOrder = -100;
  return m;
}

function createArtScene(meta, tex, opts = {}) {
  const { withSky = false, withBackdrop = false, driveFromX = 1.35, driveDur = 4.2 } = opts;
  const group = new THREE.Group();

  if (withBackdrop) group.add(skyPlane(meta.skyStops, meta.size));
  else if (withSky) group.add(skyPlane(meta.skyStops));

  /* —— 24 颗星星合批绘制，保留各自的位置、大小和闪烁节奏。 —— */
  const sparkTex = sparkleTexture();
  const stars = [];
  const starMesh = new THREE.InstancedMesh(
    new THREE.PlaneGeometry(0.055, 0.055),
    new THREE.MeshBasicMaterial({ map: sparkTex, transparent: true, depthWrite: false,
      blending: THREE.AdditiveBlending }), 24
  );
  starMesh.name = 'sparkles';
  starMesh.renderOrder = -10;
  starMesh.frustumCulled = false;
  starMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
  const starTransform = new THREE.Object3D();
  const starColor = new THREE.Color();
  for (let i = 0; i < 24; i++) {
    const s = { x: (Math.random() - 0.5) * 1.1, y: -0.02 + Math.random() * 0.45,
      z: -1.0 + Math.random() * 0.45, ph: Math.random() * Math.PI * 2,
      base: 0.5 + Math.random() * 0.8 };
    stars.push(s);
    starTransform.position.set(s.x, s.y, s.z);
    starTransform.updateMatrix();
    starMesh.setMatrixAt(i, starTransform.matrix);
    starMesh.setColorAt(i, starColor.setRGB(1, 1, 1));
  }
  starMesh.instanceColor.setUsage(THREE.DynamicDrawUsage);
  group.add(starMesh);

  /* —— 站牌（绕底部支点轻摆） —— */
  const signZ = 0.012;
  const signGroup = new THREE.Group();
  {
    const [x0, y0, x1, y1] = meta.rects.sign;
    const sign = spriteMesh('sign', meta, tex, 0);
    sign.material.side = THREE.DoubleSide;      // 翻转时背面可见
    const pivotX = pxX(meta.signPivot[0]);      // 使用新站牌的杆轴
    const pyBottom = pxY(meta.signPivot[1]);
    signGroup.position.set(pivotX, pyBottom, signZ);
    sign.position.set(pxX((x0 + x1) / 2) - pivotX, pxY((y0 + y1) / 2) - pyBottom, 0);
    signGroup.add(sign);
    group.add(signGroup);
  }

  /* —— 长椅 —— */
  const bench = spriteMesh('bench', meta, tex, 0.02);
  group.add(bench);

  /* —— 面包巴士（整体悬浮/驶入），车轮独立旋转 —— */
  const busGroup = new THREE.Group();
  const bus = spriteMesh('bus', meta, tex, 0);
  busGroup.add(bus);
  const wheels = [];
  meta.wheels.forEach(([wx, wy, wr], i) => {
    const wheel = new THREE.Group();
    wheel.position.set(pxX(wx), pxY(wy), 0.004);
    const material = new THREE.MeshBasicMaterial({
      map: tex['wheel' + i], transparent: true, depthWrite: false
    });
    /* 原画含右上侧的轮胎厚度；外壳保持朝向，只旋转轮毂同心的正面。 */
    const casing = new THREE.Mesh(
      new THREE.PlaneGeometry(2 * wr * UNIT, 2 * wr * UNIT), material
    );
    casing.renderOrder = meta.renderOrder['wheel' + i];
    wheel.add(casing);
    const geometry = new THREE.CircleGeometry(meta.wheelFaces[i].radius * UNIT, 96);
    const position = geometry.attributes.position;
    const uv = geometry.attributes.uv;
    for (let j = 0; j < uv.count; j++) {
      uv.setXY(j, 0.5 + position.getX(j) / (2 * wr * UNIT),
                  0.5 + position.getY(j) / (2 * wr * UNIT));
    }
    const face = new THREE.Mesh(geometry, material);
    face.position.z = 0.0005;
    face.renderOrder = casing.renderOrder + 1;
    wheel.add(face);
    busGroup.add(wheel);
    wheels.push(face);
  });
  busGroup.position.z = -0.04;
  group.add(busGroup);

  /* —— 鸟群 —— */
  const birds = [];
  const birdDefs = [
    { name: 'bird1', z: 0.045, phase: 0.0 },
    { name: 'bird2', z: 0.046, phase: 1.3 },
    { name: 'bird3', z: 0.047, phase: 2.4 },
    { name: 'bird4', z: 0.048, phase: 3.1 },
    { name: 'bird6', z: 0.049, phase: 4.2 },
  ];
  birdDefs.forEach((d) => {
    const m = spriteMesh(d.name, meta, tex, d.z);
    const base = m.position.clone();
    m.userData = { baseY: base.y, phase: d.phase, baseRot: 0 };
    birds.push(m);
    group.add(m);
  });

  /* —— 驶入状态 —— */
  const busRest = new THREE.Vector3(0, 0, -0.04);
  const busStart = new THREE.Vector3(driveFromX, 0, -0.04);
  let drive = null, wheelAngle = 0;
  let hornFired = false, cheerFired = false, wasDriving = false;

  const animate = (t) => {
    /* 巴士 */
    let driving = false, driveK = 1;
    if (drive) {
      const p = Math.min(1, Math.max(0, (t - drive.t0) / driveDur));
      driveK = p;
      const e = p * p * (3 - 2 * p);                         // 平滑起步、缓缓停下
      const radius = meta.wheelFaces[0].rollingRadius * UNIT;
      wheelAngle = drive.wheelStart - (-busStart.x * e) / radius;
      if (p < 1) {
        driving = true;
        busGroup.position.x = busStart.x * (1 - e);
        busGroup.position.y = busRest.y
          + Math.sin(p * Math.PI) * 0.006                    // 轻微起伏
          + Math.sin(t * 8) * 0.002 * (1 - e);               // 行驶微震
        busGroup.rotation.z = 0;
        busGroup.rotation.x = 0;
      } else {
        drive = null;
        busGroup.position.copy(busRest);
        busGroup.rotation.set(0, 0, 0);
      }
    }
    if (!driving) {
      busGroup.position.y = busRest.y + Math.sin(t * 1.1) * 0.008;
      busGroup.rotation.z = Math.sin(t * 0.8) * 0.004;
    }
    /* 转角跟随实际驶入距离，停车后不再原地空转。 */
    wheels.forEach(w => { w.rotation.z = wheelAngle; });

    /* 鸟群：每只独立地上下跳跃 */
    const excite = 1 + (1 - driveK) * 1.1;
    birds.forEach((b, i) => {
      const ph = b.userData.phase;
      const period = (2.4 + (i * 0.53) % 1.6) / excite;   // 各自周期不同
      const cyc = ((t / period) + ph) % 1;
      let hop = 0;
      if (cyc < 0.55) {
        const q = cyc / 0.55;                              // 抛物线式腾空
        hop = 4 * q * (1 - q);
      }
      const h = 0.020 + (i % 3) * 0.006;                   // 跳起高度不同
      b.position.y = b.userData.baseY + hop * h + Math.sin(t * 1.3 + ph) * 0.002;
      b.rotation.z = Math.sin(t * 2 + ph) * 0.02 + hop * 0.04;
    });

    /* 站牌：轻摆 + 周期性整体翻转 */
    const flipCycle = 5.0;
    const fu = (t % flipCycle) / flipCycle;
    let signRotY = Math.sin(t * 0.6) * 0.08;
    if (fu < 0.22) {
      const q = fu / 0.22;
      const fe = q * q * (3 - 2 * q);
      signRotY += Math.PI * 2 * fe;
    }
    signGroup.rotation.y = signRotY;
    signGroup.rotation.z = Math.sin(t * 0.7) * 0.008;

    /* 星星闪烁：更新实例缓冲，不再逐颗提交绘制。 */
    stars.forEach((s, i) => {
      const k = 0.5 + 0.5 * Math.sin(t * 2.2 + s.ph);
      const light = 0.35 + k * 0.6;
      starTransform.position.set(s.x, s.y, s.z);
      starTransform.scale.setScalar(0.5 + k * s.base);
      starTransform.updateMatrix();
      starMesh.setMatrixAt(i, starTransform.matrix);
      starMesh.setColorAt(i, starColor.setRGB(light, light, light));
    });
    starMesh.instanceMatrix.needsUpdate = true;
    starMesh.instanceColor.needsUpdate = true;
  };

  const startDriveIn = (t0) => {
    drive = { t0: t0 == null ? 0 : t0, wheelStart: wheelAngle };
  };

  return { group, animate, startDriveIn };
}

document.getElementById('arBtn').addEventListener('click', () => {
  if (arBusy || vrBusy || entryMode) return;
  entryMode = 'AR';
  ensureAudio();
  music.enter(true);                 // 移动端的有声播放必须由这次真实点按触发
  /* 先给手指一个立即反馈，再进入异步加载 */
  const b = document.getElementById('arBtn');
  b.disabled = true;
  b.textContent = '正在准备…';
  requestAnimationFrame(() => {
    setTimeout(() => { startAR(); }, 0);
  });

let arBusy = false;
async function startAR() {
  if (arBusy || vrBusy || entryMode === 'VR') return;
  arBusy = true;
  entryMode = 'AR';
  music.enter(false);
  splash.style.display = 'none';
  statusEl.classList.remove('hidden');
  statusEl.textContent = '正在启动识别引擎…';
  const engineHint = setTimeout(() => {
    statusEl.textContent = '正在加载识别引擎…（首次较慢，请稍候）';
  }, 2000);
  try {
    await ensureMindAR();
    clearTimeout(engineHint);
  } catch (e) {
    clearTimeout(engineHint);
    arBusy = false;
    music.stop();
    statusEl.textContent = '识别引擎加载失败：' + (e && e.message || e) + '，请检查网络后重试';
    setTimeout(backToSplash, 3500);
    return;
  }

  statusEl.textContent = '请求摄像头权限…（请在弹窗中允许）';
  const permHint = setTimeout(() => {
    statusEl.textContent = '还在等待授权…请检查浏览器是否弹出了摄像头权限窗口，或刷新页面重试';
  }, 25000);
  let camStream = null;
  try {
    camStream = await requestCameraStream();
    clearTimeout(permHint);
    /* 不关流：这路流会直接交给 MindAR 复用，避免 iOS 二次请求摄像头的竞态 */
  } catch (e) {
    clearTimeout(permHint);
    music.stop();
    statusEl.textContent = e && e.name === 'NotAllowedError'
      ? '摄像头权限被拒绝：请刷新页面并在弹窗中点「允许」'
      : '无法访问摄像头：' + (e && e.message || e.name || '未知错误');
    setTimeout(backToSplash, 3000);
    arBusy = false;
    return;
  }

  statusEl.textContent = '加载插画素材与识别数据…';
  const fetchMind = async () => {
    const resp = await fetch('./assets/target.mind');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const total = +resp.headers.get('content-length') || 833135;
    const reader = resp.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      statusEl.textContent = '加载识别数据… ' + Math.min(99, Math.round(got / total * 100)) + '%';
    }
    return URL.createObjectURL(new Blob(chunks, { type: 'application/octet-stream' }));
  };
  let mindUrl;
  try {
    const [, url] = await Promise.all([
      loadArtAssets().catch((e) => { throw new Error('插画素材加载失败：' + (e && e.message || e)); }),
      fetchMind().catch((e) => { throw new Error('识别数据下载失败：' + (e && e.message || '网络错误')); }),
    ]);
    mindUrl = url;
  } catch (e) {
    if (camStream) camStream.getTracks().forEach(track => track.stop());
    music.stop();
    statusEl.textContent = (e && e.message || '素材加载失败') + '，请检查网络后重试';
    setTimeout(backToSplash, 3500);
    arBusy = false;
    return;
  }

  const mindarThree = new MindARThree({
    container: document.getElementById('container'),
    imageTargetSrc: mindUrl,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    maxTrack: 1,
  });
  const { renderer, scene, camera } = mindarThree;
  renderer.setPixelRatio(getRenderPixelRatio(devicePixelRatio, MOBILE_VIEW));
  const monitor = createFrameMonitor(renderer, 'AR');
  monitor.setCamera(camStream.getVideoTracks()[0].getSettings());
  const anchor = mindarThree.addAnchor(0);
  const anchorRoot = anchor.group || anchor;

  const art = createArtScene(ART_META, ART_TEX, { withBackdrop: true, driveFromX: -1.15, driveDur: 5.2 });
  art.group.position.z = 0.01;
  anchorRoot.add(art.group);

  /* 用预检拿到的流启动视频，绕开 MindAR 内部的二次 getUserMedia */
  mindarThree._startVideo = () => new Promise((resolve, reject) => {
    statusEl.textContent = '启动摄像头…';
    const video = document.createElement('video');
    video.setAttribute('autoplay', '');
    video.setAttribute('muted', '');
    video.setAttribute('playsinline', '');
    video.style.cssText = 'position:absolute;top:0;left:0;z-index:-2;';
    mindarThree.video = video;
    mindarThree.container.appendChild(video);
    if (!camStream) { reject(new Error('摄像头流不可用')); return; }
    video.srcObject = camStream;
    const timer = setTimeout(() => reject(new Error('摄像头视频流启动超时')), 20000);
    const ok = () => { clearTimeout(timer); resolve(); };
    video.addEventListener('loadedmetadata', ok, { once: true });
    if (video.play) video.play().catch(() => {});
  });
  const origAR = mindarThree._startAR.bind(mindarThree);
  mindarThree._startAR = async () => { statusEl.textContent = '初始化识别引擎…（首次最长约 1 分钟）'; return origAR(); };

  anchor.onTargetFound = () => {
    monitor.reset();
    monitor.setTracking(true);
    statusEl.textContent = '✦ 彩蛋解锁 ✦';
    hintEl.classList.add('hidden');
    setTimeout(() => statusEl.classList.add('hidden'), 2500);
  };
  anchor.onTargetLost = () => {
    monitor.reset();
    monitor.setTracking(false);
    renderer.clear();
    statusEl.classList.add('hidden');
    hintEl.classList.remove('hidden');
  };
  anchor.onTargetUpdate = () => { if (anchorRoot.visible) monitor.track(performance.now()); };

  const t0Init = Date.now();
  const tickInit = setInterval(() => {
    const sec = Math.round((Date.now() - t0Init) / 1000);
    statusEl.textContent = '初始化识别引擎…已等待 ' + sec + ' 秒（首次较慢属正常）';
  }, 5000);
  let initTimer;
  const timeout = new Promise((_, rej) => {
    initTimer = setTimeout(() => rej(new Error('初始化超时（150秒）')), 150000);
  });
  try {
    await Promise.race([mindarThree.start(), timeout]);
  } catch (e) {
    clearInterval(tickInit);
    music.stop();
    if (camStream) camStream.getTracks().forEach(t => t.stop());
    if (mindarThree.controller) mindarThree.controller.stopProcessVideo();
    renderer.setAnimationLoop(null);
    disposeArtScene(art.group);
    monitor.dispose();
    renderer.dispose();
    renderer.domElement.remove();
    mindarThree.cssRenderer.domElement.remove();
    if (mindarThree.video) mindarThree.video.remove();
    statusEl.textContent = '启动失败：' + (e && e.message || '未知错误') + '，请刷新重试';
    setTimeout(backToSplash, 4000);
    arBusy = false;
    return;
  } finally {
    clearTimeout(initTimer);
    URL.revokeObjectURL(mindUrl);
  }
  clearInterval(tickInit);
  statusEl.classList.add('hidden');
  hintEl.classList.remove('hidden');

  const clock = new THREE.Clock();
  let driveStarted = false, t = 0;
  const renderAR = () => {
    const dt = clock.getDelta();
    if (document.hidden || !anchorRoot.visible) return;
    t += dt;
    if (!driveStarted) {
      art.startDriveIn(t + 0.1);
      driveStarted = true;
    }
    art.animate(t);
    renderer.render(scene, camera);
    monitor.frame(performance.now(), t);
  };
  const onARVisibility = () => {
    clock.getDelta();
    monitor.reset();
    renderer.setAnimationLoop(document.hidden ? null : renderAR);
  };
  document.addEventListener('visibilitychange', onARVisibility);
  onARVisibility();
}

/* ══════════ VR 模式 ══════════ */
let vrActive = false;
let vrState = null;
let vrRequest = 0;
let yawT = 0, pitchT = 0, lastInteract = 0, gyroBase = null, gyroOff = 0;

function exitVR() {
  vrRequest += 1;
  vrActive = false;
  const state = vrState;
  vrState = null;
  if (state) state.cleanup();
  vrRoot.style.display = 'none';
  statusEl.classList.add('hidden');
  vrBusy = false;
  backToSplash();
}

document.getElementById('vrBtn').addEventListener('click', () => { ensureAudio(); enterVR(false); });
document.getElementById('vrExit').addEventListener('click', exitVR);

/* 拖动 / 陀螺仪（全局监听一次） */
{
  let dragging = false, lastX = 0, lastY = 0;
  vrRoot.addEventListener('pointerdown', (e) => {
    if (!vrActive) return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
  });
  vrRoot.addEventListener('pointermove', (e) => {
    if (!dragging || !vrActive) return;
    yawT   = Math.max(-0.5, Math.min(0.5, yawT + (e.clientX - lastX) * 0.004));
    pitchT = Math.max(-0.18, Math.min(0.22, pitchT - (e.clientY - lastY) * 0.003));
    lastX = e.clientX; lastY = e.clientY;
    lastInteract = performance.now();
  });
  window.addEventListener('pointerup', () => { dragging = false; });
  window.addEventListener('pointercancel', () => { dragging = false; });
  window.addEventListener('deviceorientation', (e) => {
    if (!vrActive || e.alpha == null) return;
    if (gyroBase == null) gyroBase = e.alpha;
    let d = e.alpha - gyroBase;
    d = ((d + 540) % 360) - 180;
    const next = -d * Math.PI / 180 * 0.8;
    if (Math.abs(next - gyroOff) > 0.002) lastInteract = performance.now();
    gyroOff = next;
  });
}

let vrBusy = false;
async function enterVR(auto = false) {
  if (vrBusy || arBusy || entryMode === 'AR') return;
  vrBusy = true;
  entryMode = 'VR';
  music.enter(!auto);
  const request = ++vrRequest;
  splash.style.display = 'none';
  vrRoot.style.display = 'block';
  statusEl.classList.remove('hidden');
  statusEl.textContent = '正在准备场景…';
  vrHint.textContent = '拖动画面环视 · 手机上可移动观看';
  /* iOS 必须在点击手势里申请陀螺仪权限，不能等素材下载后再申请。 */
  let gyroPermission = Promise.resolve(null);
  if (!auto && typeof DeviceOrientationEvent !== 'undefined'
      && typeof DeviceOrientationEvent.requestPermission === 'function') {
    gyroPermission = DeviceOrientationEvent.requestPermission().catch(() => null);
  }
  try {
    const [, permission] = await Promise.all([ensureThree(), gyroPermission]);
    if (request !== vrRequest) return;
    if (permission === 'granted') vrHint.textContent = '转动手机环视 · 也可拖动';
    await loadArtAssets();
    if (request !== vrRequest) return;

    yawT = 0; pitchT = 0; gyroBase = null; gyroOff = 0;
    lastInteract = performance.now();
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(getRenderPixelRatio(devicePixelRatio, MOBILE_VIEW));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    vrRoot.insertBefore(renderer.domElement, vrRoot.firstChild);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x201b33);
    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 100);
    const monitor = createFrameMonitor(renderer, 'VR');
    const state = { renderer, scene, camera, art: null, monitor, frame: 0, cleanup: null };
    vrState = state;
    let camDist = 2.4;
    const fitCamera = () => {
      const tanV = Math.tan((camera.fov * Math.PI / 180) / 2);
      const aspect = innerWidth / innerHeight;
      const halfW = 0.56, halfH = 0.40;
      camDist = Math.max(halfW / (tanV * aspect), halfH / tanV) * 1.06;
    };
    const onResize = () => {
      if (vrState !== state) return;
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      fitCamera();
      monitor.reset();
    };
    let t = 0, previous = null, yaw = 0, pitch = 0;
    const onVisibility = () => {
      cancelAnimationFrame(state.frame);
      state.frame = 0; previous = null;
      monitor.reset();
      if (!document.hidden && vrState === state) state.frame = requestAnimationFrame(tick);
    };
    state.cleanup = () => {
      cancelAnimationFrame(state.frame);
      window.removeEventListener('resize', onResize);
      document.removeEventListener('visibilitychange', onVisibility);
      if (state.art) disposeArtScene(state.art.group);
      monitor.dispose();
      renderer.dispose();
      renderer.domElement.remove();
    };
    fitCamera();
    window.addEventListener('resize', onResize);
    document.addEventListener('visibilitychange', onVisibility);

    const art = createArtScene(ART_META, ART_TEX, { withSky: true, driveFromX: -1.35, driveDur: 6.5 });
    state.art = art;
    scene.add(art.group);
    art.startDriveIn(0.9);
    vrActive = true;
    statusEl.classList.add('hidden');

    function tick() {
      if (vrState !== state || !vrActive || document.hidden) return;
      const now = performance.now();
      const elapsed = previous == null ? 1 / 60 : Math.max(0, (now - previous) / 1000);
      const dt = Math.min(elapsed, 0.1);
      previous = now;
      t += elapsed;
      art.animate(t);

      /* 相机：小角度环绕（纸偶剧场的视差）+ 缓慢呼吸漂移 */
      const idle = performance.now() - lastInteract > 3000;
      const breatheY = idle ? Math.sin(t * 0.22) * 0.035 : 0;
      const breatheX = idle ? Math.sin(t * 0.17) * 0.012 : 0;
      const ty = yawT + gyroOff * 0.5 + breatheY;
      const tp = pitchT + breatheX;
      const blend = dampingFactor(dt);
      yaw += (ty - yaw) * blend;
      pitch += (tp - pitch) * blend;

      const cy0 = -0.05;
      camera.position.set(
        Math.sin(yaw) * Math.cos(pitch) * camDist,
        Math.sin(pitch) * camDist + cy0,
        Math.cos(yaw) * Math.cos(pitch) * camDist
      );
      camera.lookAt(0, cy0, 0);
      renderer.render(scene, camera);
      monitor.frame(now, t);
      state.frame = requestAnimationFrame(tick);
    }
    onVisibility();
  } catch (e) {
    if (request !== vrRequest) return;
    exitVR();
    showErr('场景加载失败：' + (e && e.message || e));
  }
}

/* 空闲预热：页面打开后先把识别引擎（three + MindAR）编译好，
   点「开始 AR」时不再等 3.8MB 的下载/解析；随后再预加载插画素材。 */
const idleRun = (fn) => {
  if ('requestIdleCallback' in window) requestIdleCallback(fn, { timeout: 3000 });
  else setTimeout(fn, 700);
};
const wantsVR = new URLSearchParams(location.search).get('mode') === 'vr';
if (!wantsVR) {
  setTimeout(() => {
    ensureMindAR()
      .then(() => idleRun(() => { loadArtAssets().catch(() => {}); }))
      .catch(() => {});
  }, 1200);
}

if (wantsVR) {
  enterVR(true);
}
</script>
