<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>黑鸟面包巴士 · 月历彩蛋</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; background:#0e0e1a; overflow:hidden;
    font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
  #container { position:fixed; inset:0; }
  video, canvas { position:absolute; top:0; left:0; }

  /* ── 启动页 ─────────────────────────── */
  #splash { position:fixed; inset:0; z-index:30; background:#0e0e1a; color:#f5f0e6;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px; padding:24px; }
  #splash h1 { font-size:22px; letter-spacing:2px; margin:0; color:#ffd34d; }
  #splash p { font-size:14px; line-height:1.8; margin:0; opacity:.85; text-align:center; }
  #startBtn { margin-top:10px; padding:14px 44px; font-size:16px; letter-spacing:4px;
    border:none; border-radius:999px; background:#ffd34d; color:#222; font-weight:600; }
  #previewBtn { margin-top:6px; padding:10px 30px; font-size:13px; letter-spacing:2px;
    border:1px solid #555; border-radius:999px; background:transparent; color:#bbb; }
  .bird { font-size:44px; animation: flap 1.6s ease-in-out infinite; }
  @keyframes flap { 0%,100%{transform:translateY(0) rotate(-6deg)} 50%{transform:translateY(-10px) rotate(6deg)} }

  /* ── 状态条 ─────────────────────────── */
  #status { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:20;
    background:rgba(14,14,26,.75); color:#f5f0e6; font-size:13px; letter-spacing:1px;
    padding:8px 18px; border-radius:999px; pointer-events:none; transition:opacity .4s; }
  #scanHint { position:fixed; top:60px; left:50%; transform:translateX(-50%); z-index:20;
    color:#ffd34d; font-size:15px; letter-spacing:2px; pointer-events:none; text-shadow:0 1px 6px rgba(0,0,0,.8);
    transition:opacity .4s; }
  .hidden { opacity:0 !important; }

  /* ── 预览模式（无摄像头彩蛋页）───────── */
  #preview { position:fixed; inset:0; z-index:25; background:#0e0e1a; display:none;
    flex-direction:column; align-items:center; justify-content:center; overflow:hidden; }
  #preview .art { position:relative; width:min(86vw, 86vh, 560px); }
  #preview img.target { width:100%; display:block; border-radius:14px;
    box-shadow:0 20px 60px rgba(0,0,0,.6); }
  #preview .glow { position:absolute; inset:-30px; background:radial-gradient(circle,
    rgba(255,211,77,.25), transparent 65%); animation: pulse 3s ease-in-out infinite; pointer-events:none; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }
  #preview .caption { margin-top:26px; color:#f5f0e6; font-size:15px; letter-spacing:3px; text-align:center; line-height:2; }
  #preview .caption .hl { color:#ffd34d; }
</style>
</head>
<body>

<!-- 启动页 -->
<div id="splash">
  <div class="bird">🐦‍⬛</div>
  <h1>黑鸟面包巴士</h1>
  <p>2026 伊坂幸太郎月历 · 隐藏彩蛋<br>
     点击下方按钮，把镜头对准月历上的插画<br>
     <span style="opacity:.6">（会请求摄像头权限，画面不会上传）</span></p>
  <button id="startBtn">开始探索</button>
  <button id="previewBtn">先看一眼彩蛋 →</button>
  <p style="font-size:11px;opacity:.4;margin-top:14px">v6</p>
</div>

<div id="container"></div>
<div id="status" class="hidden">加载中…</div>
<div id="scanHint" class="hidden">对准月历上的「BYE BYE BLACKBIRD」插画 ✦</div>

<!-- 无摄像头预览页 -->
<div id="preview">
  <div class="art">
    <div class="glow"></div>
    <img class="target" src="./assets/target.jpg" alt="月历插画">
  </div>
  <div class="caption">
    要变成一块<span class="hl">好吃的面包</span>哦 🍞<br>
    <span style="font-size:12px; opacity:.55">这是彩蛋的预览形态 · 打开摄像头扫描月历可以看到立体版</span>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./lib/three.module.js",
    "three/addons/": "./lib/addons/",
    "mindar-image-three": "./lib/mindar-image-three.prod.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';

const statusEl   = document.getElementById('status');
const hintEl     = document.getElementById('scanHint');
const splash     = document.getElementById('splash');
const preview    = document.getElementById('preview');

/* 手机上看不到控制台：把未捕获错误直接显示到状态栏 */
const showErr = (msg) => {
  statusEl.classList.remove('hidden');
  statusEl.textContent = '⚠ ' + String(msg).slice(0, 120);
};
window.addEventListener('error', (e) => showErr(e.message || '脚本错误'));
window.addEventListener('unhandledrejection', (e) => {
  const r = e.reason;
  showErr((r && (r.message || r)) || '未处理的异常');
});

document.getElementById('previewBtn').addEventListener('click', () => {
  splash.style.display = 'none';
  preview.style.display = 'flex';
  buildPreviewScene();
});

/* ── 预览模式：把同款 three.js 动画直接叠加在插画上 ── */
let previewBuilt = false;
function buildPreviewScene() {
  if (previewBuilt) return;
  previewBuilt = true;
  const artEl = preview.querySelector('.art');
  const w = artEl.clientWidth, h = artEl.clientHeight;
  const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.domElement.style.cssText = 'position:absolute;inset:0;pointer-events:none;';
  artEl.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 100);
  camera.position.set(0, 0, 3.2);   // 拉近，让彩蛋元素占比合适
  const anchor = new THREE.Group();
  scene.add(anchor);
  buildBirdScene(anchor);
  const clock = new THREE.Clock();
  (function tick() {
    const t = clock.getElapsedTime();
    anchor.userData.animate?.(t);
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  })();
}

/* ── AR 主流程 ─────────────────────────── */
const startBtn = document.getElementById('startBtn');
startBtn.addEventListener('click', startAR);

async function startAR() {
  splash.style.display = 'none';
  statusEl.classList.remove('hidden');

  /* 第 1 步：自己先做摄像头权限检查（MindAR 内部对权限拒绝的报错传不出来，必须自查） */
  statusEl.textContent = '请求摄像头权限…（请在弹窗中允许）';
  const permHint = setTimeout(() => {
    statusEl.textContent = '还在等待授权…请检查浏览器是否弹出了摄像头权限窗口，或刷新页面重试';
  }, 25000);
  let camStream = null;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    clearTimeout(permHint);
    camStream.getTracks().forEach(t => t.stop());   // 验完立刻释放
  } catch (e) {
    clearTimeout(permHint);
    statusEl.textContent = e && e.name === 'NotAllowedError'
      ? '摄像头权限被拒绝：请刷新页面并在弹窗中点「允许」（或点浏览器地址栏旁的摄像头图标重新允许）'
      : '无法访问摄像头：' + (e && e.message || e.name || '未知错误');
    setTimeout(() => { splash.style.display = 'flex'; }, 3000);
    return;
  }

  /* 第 2 步：自己先带进度条下载识别数据（833KB），再交给 MindAR（同 URL 已在缓存） */
  statusEl.textContent = '加载识别数据… 0%';
  let mindUrl;
  try {
    const resp = await fetch('./assets/target.mind');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const total = +resp.headers.get('content-length') || 833135;
    const reader = resp.body.getReader();
    const chunks = []; let got = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      chunks.push(value); got += value.length;
      statusEl.textContent = '加载识别数据… ' + Math.min(99, Math.round(got / total * 100)) + '%';
    }
    mindUrl = URL.createObjectURL(new Blob(chunks, { type: 'application/octet-stream' }));
  } catch (e) {
    statusEl.textContent = '识别数据下载失败（' + (e && e.message || '网络错误') + '），请检查网络后刷新重试';
    setTimeout(() => { splash.style.display = 'flex'; }, 3500);
    return;
  }

  const mindarThree = new MindARThree({
    container: document.getElementById('container'),
    imageTargetSrc: mindUrl,
    uiLoading: 'no', uiScanning: 'no', uiError: 'no',
    maxTrack: 1,
  });
  const { renderer, scene, camera } = mindarThree;
  const anchor = mindarThree.addAnchor(0);
  buildBirdScene(anchor);

  /* 阶段提示：手机首次初始化可能要 10-60 秒，让用户看到进展 */
  const origVideo = mindarThree._startVideo.bind(mindarThree);
  mindarThree._startVideo = async () => {
    statusEl.textContent = '启动摄像头…';
    return origVideo();
  };
  const origAR = mindarThree._startAR.bind(mindarThree);
  mindarThree._startAR = async () => {
    statusEl.textContent = '初始化识别引擎…（首次最长约 1 分钟，请稍等）';
    return origAR();
  };

  anchor.onTargetFound = () => {
    statusEl.textContent = '✦ 彩蛋解锁 ✦';
    hintEl.classList.add('hidden');
    setTimeout(() => statusEl.classList.add('hidden'), 2500);
  };
  anchor.onTargetLost = () => {
    statusEl.classList.add('hidden');
    hintEl.classList.remove('hidden');
  };

  const startPromise = mindarThree.start();
  const timeout = new Promise((_, rej) =>
    setTimeout(() => rej(new Error('初始化超时（90秒）')), 90000));
  try {
    await Promise.race([startPromise, timeout]);
  } catch (e) {
    console.error(e);
    statusEl.textContent = '启动失败：' + (e && e.message || '未知错误') + '，请刷新重试';
    setTimeout(() => { splash.style.display = 'flex'; }, 4000);
    return;
  }
  statusEl.classList.add('hidden');
  hintEl.classList.remove('hidden');

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const t = clock.getElapsedTime();
    anchor.userData.animate?.(t);
    renderer.render(scene, camera);
  });
}

/* ═══════════════════════════════════════════
   彩蛋场景（AR 与预览共用）
   元素取自插画：黑影乌鸦 × 星星 × 面包 × 横幅
   ═══════════════════════════════════════════ */
function buildBirdScene(anchor) {
  const group = new THREE.Group();

  /* 1. 绕飞的乌鸦群（简单形状小鸟，纯代码建模，零外部资源） */
  const crowMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
  const crows = [];
  for (let i = 0; i < 7; i++) {
    const crow = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.075, 0.2, 4, 8), crowMat);
    body.rotation.z = Math.PI / 2;
    const wingL = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.24, 3), crowMat);
    wingL.position.set(0, 0.05, 0.11); wingL.rotation.x = -0.5;
    const wingR = wingL.clone(); wingR.position.z = -0.11; wingR.rotation.x = 0.5;
    crow.add(body, wingL, wingR);
    // 每只鸟自己的椭圆轨道参数
    crow.userData = {
      rx: 0.9 + Math.random() * 0.5, rz: 0.45 + Math.random() * 0.3,
      speed: 0.45 + Math.random() * 0.4, phase: Math.random() * Math.PI * 2,
      y: 0.55 + Math.random() * 0.35, size: 0.7 + Math.random() * 0.6,
    };
    crow.scale.setScalar(crow.userData.size);
    crows.push(crow);
    group.add(crow);
  }

  /* 2. 闪烁星星（黄色小星，呼应插画里的星点） */
  const starMat = new THREE.MeshBasicMaterial({ color: 0xffd34d });
  const stars = [];
  for (let i = 0; i < 26; i++) {
    const s = new THREE.Mesh(new THREE.OctahedronGeometry(0.018 + Math.random() * 0.018), starMat);
    s.position.set((Math.random() - 0.5) * 2.4, (Math.random() - 0.5) * 1.6, -0.1);
    s.userData = { phase: Math.random() * Math.PI * 2, base: s.scale.x };
    stars.push(s);
    group.add(s);
  }

  /* 3. 发光的面包（对准插画里巴士烤箱窗的位置：目标图宽归一化为 1，中心为原点） */
  const bread = new THREE.Mesh(new THREE.CapsuleGeometry(0.13, 0.18, 8, 16),
    new THREE.MeshBasicMaterial({ color: 0xe8a54b, transparent: true, opacity: 0.92 }));
  bread.position.set(-0.30, 0.05, 0.30);
  bread.rotation.z = 1.1;
  bread.scale.setScalar(0.85);
  group.add(bread);
  const breadGlow = new THREE.Mesh(new THREE.SphereGeometry(0.34, 16, 16),
    new THREE.MeshBasicMaterial({ color: 0xffd34d, transparent: true, opacity: 0.16 }));
  breadGlow.position.copy(bread.position);
  group.add(breadGlow);

  /* 4. 横幅文字（放在上方天空区，避免和插画自带的横幅重复） */
  const banner = makeTextBanner('✦ 2026 黑鸟面包巴士 ✦');
  banner.position.set(0, 0.62, 0.4);
  banner.scale.setScalar(0.001);       // 从小到大展开
  group.add(banner);

  /* MindAR 的 anchor 是普通对象 {group: THREE.Group,...}，内容要加到 group 上；
     预览模式传入的是 THREE.Group 本身 —— 两者兼容 */
  const root = anchor.group || anchor;
  root.add(group);
  if (!anchor.userData) anchor.userData = {};   // 普通对象没有 userData，补上
  anchor.userData.animate = (t) => {
    crows.forEach((c) => {
      const u = c.userData;
      c.position.set(
        Math.cos(t * u.speed + u.phase) * u.rx,
        u.y + Math.sin(t * u.speed * 2 + u.phase) * 0.08,
        Math.sin(t * u.speed + u.phase) * u.rz
      );
      c.rotation.y = Math.cos(t * u.speed + u.phase) > 0 ? 0.4 : Math.PI - 0.4;
      c.rotation.z = Math.sin(t * 6 + u.phase) * 0.5;   // 振翅
    });
    stars.forEach((s) => {
      const k = 0.5 + 0.5 * Math.sin(t * 2.2 + s.userData.phase);
      s.scale.setScalar(s.userData.base * (0.4 + k));
      s.rotation.y = t * 1.5 + s.userData.phase;
    });
    bread.rotation.y = t * 1.2;
    bread.position.y = 0.05 + Math.sin(t * 1.6) * 0.06;
    breadGlow.position.copy(bread.position);
    breadGlow.material.opacity = 0.12 + 0.07 * Math.sin(t * 2.4);
    const bk = Math.min(1, t * 0.5);
    banner.scale.setScalar(bk * (1 + Math.sin(t * 1.8) * 0.02));
  };
}

/* Canvas 生成横幅（无需外部字体文件） */
function makeTextBanner(text) {
  const cv = document.createElement('canvas');
  cv.width = 1024; cv.height = 160;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = 'rgba(14,14,26,0.82)';
  roundRect(ctx, 6, 6, cv.width - 12, cv.height - 12, 26);
  ctx.fill();
  ctx.strokeStyle = '#ffd34d'; ctx.lineWidth = 5;
  roundRect(ctx, 6, 6, cv.width - 12, cv.height - 12, 26);
  ctx.stroke();
  ctx.fillStyle = '#f5f0e6';
  ctx.font = '600 64px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(text, cv.width / 2, cv.height / 2 + 4);
  const tex = new THREE.CanvasTexture(cv);
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(1.9, 0.3),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true })
  );
  return mesh;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
</script>
</body>
</html>
